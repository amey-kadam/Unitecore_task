version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitecore-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
    
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./config.py:/app/config.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - unitecore-network

networks:
  unitecore-network:
    driver: bridge
